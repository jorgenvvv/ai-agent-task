name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Grant Gradle wrapper execute permission
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew test --no-daemon --stacktrace

      - name: Upload unit HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: |
            build/reports/tests/test/
            build/test-results/test/
          if-no-files-found: warn
          retention-days: 30

  integration:
    name: Integration tests (OpenAI)
    runs-on: ubuntu-latest
    needs: unit
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect OpenAI secret
        id: openai
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::OPENAI_API_KEY not configured — integration tests skipped"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Java 21
        if: steps.openai.outputs.present == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Grant Gradle wrapper execute permission
        if: steps.openai.outputs.present == 'true'
        run: chmod +x gradlew

      - name: Run integration tests
        if: steps.openai.outputs.present == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: ./gradlew integrationTest --no-daemon --stacktrace

      - name: Upload integration HTML report
        if: always() && steps.openai.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-report
          path: |
            build/reports/tests/integrationTest/
            build/test-results/integrationTest/
          if-no-files-found: warn
          retention-days: 30
