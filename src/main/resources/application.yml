spring:
  application:
    name: ai-agent
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        model: ${OPENAI_MODEL:gpt-4o-mini}
        temperature: ${OPENAI_TEMPERATURE:0.2}

server:
  port: 8080

app:
  knowledge:
    path: ${KNOWLEDGE_PATH:knowledge}
    search:
      top-k: ${KNOWLEDGE_SEARCH_TOP_K:3}
  agent:
    max-question-length: 2000
    grounding:
      enabled: ${AGENT_GROUNDING_ENABLED:true}
    session:
      enabled: true
      max-messages: ${AGENT_SESSION_MAX_MESSAGES:20}
      max-sessions: ${AGENT_SESSION_MAX_SESSIONS:1000}
      ttl: ${AGENT_SESSION_TTL:45m}
    rate-limit:
      enabled: ${AGENT_RATE_LIMIT_ENABLED:true}
      requests-per-minute: ${AGENT_RATE_LIMIT_RPM:10}
      trust-forwarded-headers: ${AGENT_TRUST_FORWARDED_HEADERS:false}
