spring:
  application:
    name: ai-agent
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        model: ${OPENAI_MODEL:gpt-4o-mini}
        temperature: ${OPENAI_TEMPERATURE:0.2}

server:
  port: 8080

app:
  knowledge:
    path: ${KNOWLEDGE_PATH:knowledge}
    search:
      top-k: ${KNOWLEDGE_SEARCH_TOP_K:3}
  agent:
    max-question-length: 2000
